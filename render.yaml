services:
  - type: web
    name: cloud-guardian-api
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-guardian-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cloud-guardian-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: worker
    name: cloud-guardian-worker
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A workers.celery_app worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-guardian-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cloud-guardian-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: cloud-guardian-api
          envVarKey: SECRET_KEY

  - type: web
    name: cloud-guardian-frontend
    runtime: static
    region: oregon
    branch: main
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: cloud-guardian-db
    plan: basic-256mb
    region: oregon
    databaseName: cloud_guardian
    postgresMajorVersion: "16"

keyvalue:
  - name: cloud-guardian-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
