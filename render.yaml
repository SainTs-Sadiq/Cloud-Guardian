services:
  - type: web
    name: cloud-guardian-api
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-guardian-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cloud-guardian-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CG_SKIP_CREATE_ALL
        value: "1"
      - key: CG_USE_LOCAL_STORE
        value: "false"
      # Browser-facing URL of the static frontend (public, not a secret).
      # Placeholder: replace with the real static site URL after first deploy.
      - key: CG_CORS_ORIGINS
        value: https://cloud-guardian-frontend.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: cloud-guardian-worker
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A workers.celery_app worker --loglevel=info -Q scans,remediations,default
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-guardian-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cloud-guardian-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: cloud-guardian-api
          envVarKey: SECRET_KEY
      - key: CG_SKIP_CREATE_ALL
        value: "1"
      - key: CG_USE_LOCAL_STORE
        value: "false"

  # Scheduler: must run as exactly ONE instance (duplicate beats enqueue duplicate scans).
  # Do not scale this service above 1.
  - type: worker
    name: cloud-guardian-beat
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A workers.celery_app beat --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-guardian-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cloud-guardian-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: cloud-guardian-api
          envVarKey: SECRET_KEY
      - key: CG_SKIP_CREATE_ALL
        value: "1"
      - key: CG_USE_LOCAL_STORE
        value: "false"

  - type: web
    name: cloud-guardian-frontend
    runtime: static
    region: oregon
    branch: main
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Build-time API URL (browser-facing, so it must be the public API URL, not an internal host).
      # Placeholder: replace with the real API URL after first deploy.
      - key: VITE_API_URL
        value: https://cloud-guardian-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: cloud-guardian-db
    plan: basic-256mb
    region: oregon
    databaseName: cloud_guardian
    postgresMajorVersion: "16"

keyvalue:
  - name: cloud-guardian-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
